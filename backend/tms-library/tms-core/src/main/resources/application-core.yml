spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 1GB
---
spring:
  config:
    activate:
      on-profile: local
  output:  #console 출력 색상
    ansi:
      enabled: always

cors:
  allowed-origin-patterns: "*"
  allowed-methods: "HEAD, GET, POST, PUT, DELETE, PATCH, OPTIONS"
  allowed-headers: "*"
---
spring:
  config:
    activate:
      on-profile: dev
  output:  #console 출력 색상
    ansi:
      enabled: never

cors:
  allowed-origin-patterns: "*"
  allowed-methods: "HEAD, GET, POST, PUT, DELETE, PATCH, OPTIONS"
  allowed-headers: "*"